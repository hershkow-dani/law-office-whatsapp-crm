server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy: the "server" hostname is the docker-compose
    # service name (see docker-compose.yml), resolved by Docker's internal
    # DNS. This keeps the frontend and API on one origin from the browser's
    # perspective, so the session cookie needs no cross-origin handling.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Single-page app: any other path serves index.html so client-side state
    # (e.g. the ?resetToken= query string) is handled by the app itself.
    location / {
        try_files $uri /index.html;
    }
}
